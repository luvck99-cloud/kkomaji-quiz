else if(level<=30){a=2+((i+level)%12);b=2+((i*3+level)%10);ans=a*b;text=`${a} × ${b} = ?`}
else if(level<=40){b=2+((i+level)%9);ans=2+((i*3+level)%12);a=b*ans;text=`${a} ÷ ${b} = ?`}
else{a=10+((i*7+level)%60);b=2+((i*3+level)%25);if(mode%2){ans=a+b;text=`${a} + ${b} = ?`}else{if(a<b)[a,b]=[b,a];ans=a-b;text=`${a} − ${b} = ?`}}
let vals=[ans,ans+1,Math.max(0,ans-1),ans+2];return {id:`m-${level}-${i}`,cat:"수학",text,answer:String(ans),choices:shuffle([...new Set(vals)].map(String),level*33+i)}}
function buildLevel(level){let out=[],seen=new Set();
function add(q){if(!q||seen.has(q.text))return;seen.add(q.text);out.push(q)}
for(let i=0;i<2;i++){let r=spelling[(level*2+i)%spelling.length];add(questionFrom(r,"맞춤법",`sp-${level}-${i}`,level+i))}
for(let i=0;i<2;i++){let r=spacing[(level*2+i)%spacing.length];add(questionFrom(r,"띄어쓰기",`st-${level}-${i}`,level+i+8))}
let banks=[vocab,science,history,life],cats=["영어","과학","역사·사회","생활 상식"];
for(let i=0;i<16;i++){if(i%4===0){add(mathQuestion(level,i));continue}let k=(i+level)%4,bank=banks[k],r=bank[(level*3+i)%bank.length];add(questionFrom(r,cats[k],`${cats[k]}-${level}-${i}`,level*19+i))}
while(out.length<20){let i=out.length;add(mathQuestion(level,i+11));if(out.length<20){let k=i%4,bank=banks[k],r=bank[(level+i*2)%bank.length];add(questionFrom(r,cats[k],`extra-${level}-${i}`,level*5+i))}}
/* Next-level remediation: use distinct parallel questions from the same subject bank when possible. */
if(level>1){let prev=state.wrong.filter(w=>w.level===level-1);for(let j=0;j<Math.min(2,prev.length);j++){let w=prev[j],cat=w.cat,bank=cat==="맞춤법"?spelling:cat==="띄어쓰기"?spacing:cat==="영어"?vocab:cat==="과학"?science:cat==="역사·사회"?history:cat==="생활 상식"?life:null;if(bank){let r=bank[(w.seed+3)%bank.length];let q=questionFrom(r,cat,`review-${level}-${j}`,level*77+j);q.text="복습 도전! "+q.text;out[out.length-1-j]=q}}}
return out.slice(0,20)}
function home(){const done=Object.keys(state.done||{}).length;$("#app").innerHTML=`<section class="card"><div class="row"><div><span class="pill">나의 학습 현황</span><h2 style="margin:10px 0 3px">LEVEL ${state.unlocked} 도전 준비!</h2><div class="muted">${done}/50 레벨 완료 · 복습할 오답 ${state.wrong.length}개</div></div><div style="font-size:36px">🏅</div></div><div class="track"><div class="fill" style="width:${done/50*100}%"></div></div><button class="primary full" id="start">LEVEL ${state.unlocked} 시작하기 →</button><button class="secondary full" id="review" ${state.wrong.length?"":"disabled"}>틀린 문제 복습하기 (${state.wrong.length})</button></section><section class="card"><b>과목 탐험</b><p class="muted">맞춤법 · 띄어쓰기 · 수학 · 영어 · 과학 · 역사·사회 · 생활 상식</p><div class="grid"><div>✍️ 맞춤법</div><div>🔤 띄어쓰기</div><div>🔢 수학</div><div>🌎 영어</div><div>🔬 과학</div><div>🏛️ 역사·사회</div></div></section><section class="card"><b>레벨 선택</b><div class="muted">레벨이 올라갈수록 수학을 포함한 문제 난이도가 높아집니다.</div><div class="levels" id="levels"></div></section>`;
$("#start").onclick=()=>start(state.unlocked,false);$("#review").onclick=()=>start(state.unlocked,true);let el=$("#levels");for(let i=1;i<=50;i++){let b=document.createElement("button");b.className="level "+(state.done[i]?"done":"");b.textContent=(i<=state.unlocked?"⭐ ":"🔒 ")+i;b.disabled=i>state.unlocked;b.onclick=()=>start(i,false);el.appendChild(b)}}
function start(level,review){state.level=level;state.review=review;state.questions=review?state.wrong.slice(0,20).map((w,i)=>({id:"review-"+i,cat:w.cat,text:"다시 풀어 봐요! "+w.text,answer:w.answer,choices:w.choices,seed:w.seed})):buildLevel(level);if(!state.questions.length){home();return}state.questionIndex=0;state.score=0;state.answers=[];renderQuestion()}
function renderQuestion(){if(state.questionIndex>=state.questions.length){finish();return}let q=state.questions[state.questionIndex];$("#app").innerHTML=`<section class="card"><div class="row"><span class="pill">${state.review?"오답 복습":"LEVEL "+state.level+" · "+q.cat}</span><span class="muted">${state.questionIndex+1} / ${state.questions.length}</span></div><div class="track"><div class="fill" style="width:${state.questionIndex/state.questions.length*100}%"></div></div><div class="muted" style="margin-top:18px">${q.cat}</div><div class="question">${q.text}</div><div id="options"></div><div id="feedback"></div><div class="row" style="margin-top:16px"><span class="muted">⏱ 시간제한 없음</span><button class="primary" id="next" disabled>다음 문제 →</button></div></section><button class="secondary full" id="quit">레벨 선택으로 돌아가기</button>`;
let box=$("#options");q.choices.forEach((c,i)=>{let b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="letter">${i+1}</span><span>${c.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`;b.onclick=()=>choose(c,b);box.appendChild(b)});$("#next").onclick=()=>{state.questionIndex++;renderQuestion()};$("#quit").onclick=home}
function choose(c,btn){if(btn.disabled)return;let q=state.questions[state.questionIndex],ok=c===q.answer;if(ok)state.score++;state.answers.push({q,selected:c,ok});document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;let t=b.querySelector("span:nth-child(2)").textContent;if(t===q.answer)b.classList.add("correct");if(t===c&&!ok)b.classList.add("wrong")});$("#feedback").className="feedback "+(ok?"good":"bad");$("#feedback").innerHTML=ok?"🎉 정답이에요! 정말 잘했어요.":`괜찮아요. 정답은 <b>${q.answer}</b>예요. 다음에 비슷한 문제로 다시 연습해요!`;$("#next").disabled=false;
state.wrong=state.wrong.filter(w=>w.id!==q.id);if(!ok)state.wrong.unshift({id:q.id,cat:q.cat,text:q.text,answer:q.answer,choices:q.choices,level:state.level,seed:state.questionIndex});state.wrong=state.wrong.slice(0,100);save()}
function finish(){let n=state.questions.length,score=state.score,level=state.level;if(!state.review){state.done[level]={score,total:n};state.unlocked=Math.max(state.unlocked,Math.min(50,level+1));save()}$("#app").innerHTML=`<section class="card center"><div style="font-size:48px">${score/n>=.8?"🏆":score/n>=.5?"🌟":"🌱"}</div><h2>${state.review?"복습 완료!":"LEVEL "+level+" 완료!"}</h2><div class="muted">끝까지 도전한 것만으로도 멋져요!</div><div class="score">${score}<span class="muted" style="font-size:20px"> / ${n}점</span></div><div class="track"><div class="fill" style="width:${score/n*100}%"></div></div><p>${score===n?"완벽해요! 모든 문제를 맞혔어요.":score/n>=.8?"아주 잘했어요! 조금만 더 연습해 봐요.":"틀린 문제도 좋은 배움이에요. 복습해 봐요!"}</p><button class="primary full" id="again">다시 도전</button><button class="secondary full" id="review2">틀린 문제 복습 (${state.wrong.length})</button><button class="secondary full" id="home">레벨 선택</button></section><section class="card"><b>이번 레벨 결과</b>${state.answers.map((a,i)=>`<div style="border-top:1px solid #eee;padding:12px 0"><b>${i+1}. ${a.q.text}</b><div class="muted" style="color:${a.ok?"#26864e":"#bd3d3d"}">${a.ok?"정답":"내 답: "+a.selected+" · 정답: "+a.q.answer}</div></div>`).join("")}</section>`;
$("#again").onclick=()=>start(level,false);$("#review2").onclick=()=>start(level,true);$("#home").onclick=home}
home();
if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
