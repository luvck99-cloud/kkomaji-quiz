<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff8da1">
<title>사랑하는 주아와 퀴즈놀이</title>
<style>
:root{--pink:#ff8da1;--deep:#e65378;--cream:#fff8f0;--ink:#333445;--mint:#dff7ed;--blue:#e7f1ff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:linear-gradient(140deg,#fff3f5,#f1f7ff);color:var(--ink)}
header{padding:24px 16px 18px;text-align:center;background:linear-gradient(120deg,#ffb5c2,#ffd9a8);border-radius:0 0 28px 28px}
h1{font-size:clamp(24px,5vw,36px);margin:0 0 8px}header p{margin:0}
main{max-width:900px;margin:18px auto;padding:0 14px 40px}
.panel{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 22px #6a57700e}
button,select{font:inherit;border:0;border-radius:14px;padding:12px 15px;cursor:pointer}
button{background:var(--pink);color:#fff;font-weight:700;box-shadow:0 3px 0 #e56f88}
button:active{transform:translateY(2px);box-shadow:none}
button.secondary{background:#e8edf7;color:#3d4760;box-shadow:none}
button.mint{background:#43b995;box-shadow:0 3px 0 #268d6d}
button.gold{background:#f4b544;box-shadow:0 3px 0 #cf9225}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:8px;margin-top:12px}
.level{padding:11px 4px;background:#e9f3ff;color:#3d5270;box-shadow:none}
.level.done{background:#dff7ed;color:#207c61}.level.current{background:#ff8da1;color:#fff}
.small{font-size:13px;color:#737789}.hidden{display:none!important}
.progress{height:10px;background:#f0edf1;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#48c3a0;width:0;transition:width .2s}
.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:#fff0d9;font-size:13px;font-weight:700}
.question{font-size:clamp(21px,4vw,29px);font-weight:800;line-height:1.45;margin:20px 0;text-align:center;white-space:pre-line}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#f4f6fb;color:#35394b;box-shadow:none;border:2px solid transparent;min-height:60px;font-size:17px}
.opt:hover{border-color:#ffb0bf}.opt.correct{background:#d9f7e9;border-color:#4cb58b;color:#176b4e}.opt.wrong{background:#ffe0e4;border-color:#e96b7e;color:#9b2940}
.feedback{padding:14px;border-radius:14px;margin-top:14px;font-weight:700}.feedback.good{background:#e0f8ed;color:#176b4e}.feedback.bad{background:#fff0d9;color:#875b0b}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h2{margin:0 0 8px;font-size:21px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0edf1}.item:last-child{border-bottom:0}
.item .desc{flex:1}.item strong{display:block}.item small{color:#747789}
footer{text-align:center;color:#85889a;font-size:12px;padding:20px}
@media(max-width:520px){.options{grid-template-columns:1fr}.panel{padding:15px}.opt{min-height:54px}}
</style>
</head>
<body>
<header><h1>💗 사랑하는 주아와 퀴즈놀이 💗</h1><p>하나씩 천천히, 재미있게 도전해 보자!</p></header>
<main>
<section id="home">
 <div class="panel">
  <div class="section-title"><h2>🌈 레벨 선택</h2><span class="badge">총 50레벨 · 1,000문제</span></div>
  <p>모든 레벨이 열려 있어요. 원하는 단계를 골라 시작해 보세요!</p>
  <div class="row"><button onclick="startReview('wrong')">❌ 틀린 문제 다시 풀기 <span id="wrongCount">0</span></button><button class="mint" onclick="startReview('flagged')">🤔 애매한 문제 모음 <span id="flagCount">0</span></button></div>
  <div class="row" style="margin-top:10px"><button class="secondary" onclick="showStats()">🏆 나의 기록</button><button class="secondary" onclick="resetProgress()">기록 초기화</button></div>
  <div id="levels" class="levels"></div>
  <p class="small">문제 시간 제한 없음 · 선택한 답과 기록은 이 기기에 저장됩니다.</p>
 </div>
 <div id="stats" class="panel hidden"></div>
</section>
<section id="play" class="hidden">
 <div class="panel">
  <div class="section-title"><span class="badge" id="levelBadge">LEVEL 1</span><span id="counter">1 / 20</span></div>
  <div class="progress"><div id="bar" class="bar"></div></div>
  <div class="row" style="justify-content:space-between"><span class="small" id="category">수학</span><button class="gold" id="flagBtn" onclick="toggleFlag()">🤔 애매한 문제로 표시</button></div>
  <div id="question" class="question"></div>
  <div id="options" class="options"></div>
  <div id="feedback" class="feedback hidden"></div>
  <div class="row" style="justify-content:space-between;margin-top:16px"><button class="secondary" onclick="goHome()">레벨 목록</button><div class="row"><button id="nextBtn" onclick="nextQuestion()" disabled>다음 문제 →</button></div></div>
 </div>
</section>
<section id="review" class="hidden">
 <div class="panel">
  <div class="section-title"><h2 id="reviewTitle">다시 풀기</h2><button class="secondary" onclick="goHome()">레벨 목록</button></div>
  <p class="small">문제를 풀면 해당 모음에서 정답 여부가 갱신됩니다.</p>
  <div id="reviewBody"></div>
 </div>
</section>
</main>
<footer>주아를 위한 작은 지식 탐험 🌷</footer>
<script>
const STORE='juaQuizProgressV1';
let state=JSON.parse(localStorage.getItem(STORE)||'{"wrong":[],"flagged":[],"answered":{},"scores":{}}');
let currentLevel=1, currentIndex=0, currentSet=[], activeQuestion=null, selected=null, reviewMode=null, reviewIds=[];
const categories=['영어','수학','과학','상식','맞춤법','띄어쓰기'];
const animals=[['cat','고양이'],['dog','개'],['apple','사과'],['book','책'],['water','물'],['sun','태양'],['moon','달'],['bird','새'],['fish','물고기'],['milk','우유'],['school','학교'],['friend','친구'],['family','가족'],['happy','행복한'],['small','작은'],['big','큰'],['red','빨간색'],['blue','파란색'],['green','초록색'],['one','하나'],['two','둘'],['three','셋'],['four','넷'],['five','다섯'],['chair','의자'],['table','탁자'],['pencil','연필'],['flower','꽃'],['rain','비'],['star','별'],['bread','빵'],['rice','쌀/밥'],['run','달리다'],['read','읽다'],['jump','뛰다'],['house','집'],['door','문'],['hand','손'],['eye','눈'],['nose','코'],['mother','어머니'],['father','아버지'],['morning','아침'],['night','밤'],['hot','뜨거운'],['cold','추운'],['fast','빠른'],['slow','느린'],['clean','깨끗한'],['help','돕다']];
const spelling=[['왠지','왠지'],['웬일','웬일'],['며칠','며칠'],['금세','금세'],['어떡해','어떡해'],['설거지','설거지'],['찌개','찌개'],['역할','역할'],['희한하다','희한하다'],['개수','개수'],['맞히다','맞히다'],['바라다','바라다'],['깨끗이','깨끗이'],['굳이','굳이'],['오랜만','오랜만'],['안녕하세요','안녕하세요'],['돼요','돼요'],['할게요','할게요'],['같이','같이'],['낫다','낫다'],['어이없다','어이없다'],['며느리','며느리'],['봉숭아','봉숭아'],['숟가락','숟가락'],['가르치다','가르치다'],['가리키다','가리키다'],['잠그다','잠그다'],['통째로','통째로'],['무릅쓰고','무릅쓰고'],['며칠째','며칠째']];
const spacing=[['할 수 있다','할 수 있다'],['알아 보다','알아보다'],['한 번','한 번'],['한번 해 보다','한번 해 보다'],['우리 집','우리 집'],['돌아가다','돌아가다'],['밖에 없다','밖에 없다'],['할 만하다','할 만하다'],['잘하다','잘하다'],['잘 먹겠습니다','잘 먹겠습니다'],['이것뿐이다','이것뿐이다'],['그럴 리가 없다','그럴 리가 없다'],['큰 소리','큰 소리'],['첫 번째','첫 번째'],['오랜만에','오랜만에'],['더 이상','더 이상'],['할 때마다','할 때마다'],['집 안','집 안'],['눈앞','눈앞'],['한가운데','한가운데']];
const science=[['물은 보통 몇 도에서 얼까요?','0℃','10℃','50℃','100℃'],['식물이 자라는 데 꼭 필요한 것은?','물과 빛','플라스틱','유리구슬','연필'],['사람이 숨을 쉴 때 주로 필요한 기체는?','산소','헬륨','수소','네온'],['지구 주위를 도는 천체는?','달','태양','화성','금성'],['낮과 밤이 생기는 까닭은?','지구의 자전','달의 공전','구름의 이동','바다의 파도'],['자석에 잘 붙는 것은?','철 클립','나무젓가락','종이','고무공'],['물의 세 가지 상태가 아닌 것은?','불꽃','고체','액체','기체'],['어른이 되어도 계속 자라는 신체 부위로 알려진 것은?','귀와 코의 연골','눈알','치아의 길이','손톱뿌리 전체']];
const general=[['우리나라의 수도는 어디일까요?','서울','부산','제주','인천'],['일주일은 며칠일까요?','7일','5일','8일','10일'],['신호등에서 건너도 좋다는 뜻의 색은?','초록색','빨간색','보라색','검은색'],['책을 빌려 읽는 곳은?','도서관','세탁소','주유소','약국'],['비가 올 때 쓰는 물건은?','우산','부채','선글라스','장갑'],['편지를 보내는 곳과 관련 있는 것은?','우체국','동물원','수영장','놀이터'],['횡단보도를 건널 때 먼저 할 일은?','좌우를 살피기','뛰어가기','눈 감기','친구 밀기'],['불이 났을 때 도움을 요청하는 긴급 번호는?','119','112','114','131']];
const facts=[['벌은 꿀을 만들기 위해 주로 무엇을 모을까요?','꽃의 꿀','모래','나뭇가지','눈'],['거미의 다리는 몇 개일까요?','8개','4개','6개','10개'],['무지개는 보통 몇 가지 색으로 설명할까요?','7가지','3가지','5가지','9가지'],['겨울잠을 자는 동물로 잘 알려진 것은?','곰','닭','고래','기린'],['바닷물은 민물보다 보통 어떨까요?','짠맛이 난다','단맛이 난다','기름지다','항상 얼어 있다']];
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function makeQ(id,level,slot){
 let seed=id*17+level*31+slot*13, cat=categories[(level+slot)%6], q, ans, distractors=[];
 if(cat==='영어'){
  let pair=animals[(seed*7+slot*3)%animals.length], reverse=(slot+level)%2===0;
  q=reverse?`영단어 “${pair[0]}”의 뜻은 무엇일까요?`:`“${pair[1]}”을(를) 영어로 고르면 무엇일까요?`;
  ans=reverse?pair[1]:pair[0];
  distractors=shuffle(animals.filter(x=>x!==pair).map(x=>reverse?x[1]:x[0])).slice(0,3);
 } else if(cat==='수학'){
  let n=level+1+(seed%Math.max(2,level+3)), a,b,op=(slot+level)%4;
  if(level<10){a=1+(seed%20);b=1+((seed*3)%10);op=slot%2}
  else if(level<25){a=10+(seed%70);b=1+((seed*3)%Math.min(40,level+10))}
  else {a=20+(seed%180);b=1+((seed*3)%Math.min(90,level+20))}
  if(op===0){q=`${a} + ${b} = ?`;ans=String(a+b)}
  else if(op===1){if(b>a)[a,b]=[b,a];q=`${a} − ${b} = ?`;ans=String(a-b)}
  else if(op===2){a=1+(seed%Math.min(12,level+2));b=1+((seed*3)%Math.min(12,level+2));q=`${a} × ${b} = ?`;ans=String(a*b)}
  else {b=1+(seed%Math.min(10,level+2));a=b*(1+((seed*5)%Math.min(12,level+3)));q=`${a} ÷ ${b} = ?`;ans=String(a/b)}
  let val=Number(ans);distractors=[String(val+1),String(val-1),String(val+3)];
 } else if(cat==='과학'){
  let item=science[(seed+level)%science.length];q=item[0];ans=item[1];distractors=item.slice(2);
  if(level>25 && slot%3===0){q='식물의 뿌리가 하는 중요한 일은 무엇일까요?';ans='물을 흡수한다';distractors=['빛을 만든다','소리를 낸다','씨앗을 먹는다']}
 } else if(cat==='상식'){
  let item=(level<15?general:facts)[(seed+level)% (level<15?general.length:facts.length)];q=item[0];ans=item[1];distractors=item.slice(2);
 } else if(cat==='맞춤법'){
  let pool=spelling[(seed+level)%spelling.length];ans=pool[0];q=`다음 중 올바른 표기는 무엇일까요?\n(비슷한 표현을 잘 살펴보세요.)`;
  let wrongs={'왠지':['웬지','왠찌','웬찌'],'웬일':['왠일','웬닐','왠닐'],'며칠':['몇일','몇칠','며칠이'],'금세':['금새','금쎄','금셰'],'어떡해':['어떻해','어떡헤','어떻헤'],'설거지':['설겆이','설거찌','설거지이'],'찌개':['찌게','찌개이','찌께'],'역할':['역활','역할이','역할ㄹ'],'희한하다':['희안하다','희한허다','희한하 다'],'개수':['갯수','게수','개쑤'],'맞히다':['맞추다','마치다','맞히다'],'바라다':['바래다','바라타','바라다'],'깨끗이':['깨끗히','깨끄시','깨끗이이'],'굳이':['구지','굳히','굳이이'],'오랜만':['오랫만','오랜맨','오랜 만'],'돼요':['되요','돼여','됴요'],'할게요':['할께요','할께여','할게여'],'같이':['가치','갇이','같히'],'낫다':['낳다','낮다','낫따']};
  distractors=wrongs[ans]||['틀린 표기1','틀린 표기2','틀린 표기3'];
 } else {
  let pool=spacing[(seed+level)%spacing.length];ans=pool[0];q='다음 중 올바른 띄어쓰기는 무엇일까요?';distractors=[ans.replace(' ','')+' 요',ans+'를',ans.replace(' ','  ')];
  if(ans==='할 수 있다')distractors=['할수 있다','할 수있다','할수있다'];
  if(ans==='한 번')distractors=['한번','한  번','한 번씩'];
  if(ans==='우리 집')distractors=['우리집','우 리 집','우리  집'];
  if(ans==='잘 먹겠습니다')distractors=['잘먹겠습니다','잘 먹 겠습니다','잘먹 겠습니다'];
 }
 let options=shuffle([ans,...distractors]).filter((v,i,a)=>a.indexOf(v)===i);
 // Guarantee four distinct choices and keep the correct answer present.
 while(options.length<4){let extra='보기 '+(options.length+1);if(!options.includes(extra)&&extra!==ans)options.push(extra)}
 options=options.slice(0,4);
 if(!options.includes(ans))options[0]=ans;
 options=shuffle(options);
 return {id:String(id),level,slot,category:cat,question:q,answer:ans,options};
}
const bank=[];for(let l=1;l<=50;l++)for(let s=0;s<20;s++)bank.push(makeQ((l-1)*20+s+1,l,s));
function save(){localStorage.setItem(STORE,JSON.stringify(state));updateCounts()}
function updateCounts(){document.getElementById('wrongCount').textContent=state.wrong.length;document.getElementById('flagCount').textContent=state.flagged.length}
function buildLevels(){let el=document.getElementById('levels');el.innerHTML='';for(let l=1;l<=50;l++){let b=document.createElement('button');b.className='level';b.textContent=l;b.title='레벨 '+l+' 시작';let done=state.scores[l];if(done&&done.best>=15)b.classList.add('done');b.onclick=()=>startLevel(l);el.appendChild(b)}}
function startLevel(l){currentLevel=l;currentSet=bank.filter(q=>q.level===l);currentIndex=0;reviewMode=null;document.getElementById('home').classList.add('hidden');document.getElementById('review').classList.add('hidden');document.getElementById('play').classList.remove('hidden');renderQuestion()}
function renderQuestion(){activeQuestion=currentSet[currentIndex];selected=null;document.getElementById('levelBadge').textContent=reviewMode? '다시 풀기':`LEVEL ${activeQuestion.level}`;document.getElementById('counter').textContent=`${currentIndex+1} / ${currentSet.length}`;document.getElementById('bar').style.width=`${currentIndex/currentSet.length*100}%`;document.getElementById('category').textContent='분야: '+activeQuestion.category;document.getElementById('question').textContent=activeQuestion.question;document.getElementById('feedback').className='feedback hidden';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').disabled=true;document.getElementById('nextBtn').textContent=currentIndex===currentSet.length-1?'결과 보기 →':'다음 문제 →';document.getElementById('flagBtn').textContent=state.flagged.includes(activeQuestion.id)?'💗 애매한 문제 표시 해제':'🤔 애매한 문제로 표시';let wrap=document.getElementById('options');wrap.innerHTML='';activeQuestion.options.forEach(opt=>{let b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>answer(opt,b);wrap.appendChild(b)})}
function answer(opt,btn){if(selected!==null)return;selected=opt;let correct=opt===activeQuestion.answer;document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===activeQuestion.answer)b.classList.add('correct')});if(!correct)btn.classList.add('wrong');let f=document.getElementById('feedback');f.className='feedback '+(correct?'good':'bad');f.textContent=correct?'정답이에요! 정말 잘했어요! 🎉':`아깝다! 정답은 “${activeQuestion.answer}”예요. 다음에 다시 도전해 보자!`;let id=activeQuestion.id;if(correct){state.wrong=state.wrong.filter(x=>x!==id)}else if(!state.wrong.includes(id))state.wrong.push(id);state.answered[id]=correct;save();document.getElementById('nextBtn').disabled=false}
function toggleFlag(){let id=activeQuestion.id;if(state.flagged.includes(id))state.flagged=state.flagged.filter(x=>x!==id);else state.flagged.push(id);save();document.getElementById('flagBtn').textContent=state.flagged.includes(id)?'💗 애매한 문제 표시 해제':'🤔 애매한 문제로 표시'}
function nextQuestion(){if(selected===null)return;if(currentIndex<currentSet.length-1){currentIndex++;renderQuestion()}else finishSet()}
function finishSet(){let correct=currentSet.filter(q=>state.answered[q.id]===true).length;let old=state.scores[currentLevel]||{best:0,attempts:0};state.scores[currentLevel]={best:Math.max(old.best,correct),attempts:old.attempts+1,last:correct};save();document.getElementById('play').classList.add('hidden');document.getElementById('review').classList.remove('hidden');document.getElementById('reviewTitle').textContent=`레벨 ${currentLevel} 완료!`;document.getElementById('reviewBody').innerHTML=`<div class="question">🎉 ${correct} / 20 정답</div><p style="text-align:center">주아야, 도전하느라 정말 수고했어!</p><div class="row" style="justify-content:center"><button onclick="startLevel(${currentLevel})">이 레벨 다시 풀기</button><button class="mint" onclick="goHome()">다른 레벨 고르기</button></div>`}
function startReview(mode){reviewMode=mode;reviewIds=[...(mode==='wrong'?state.wrong:state.flagged)];currentSet=reviewIds.map(id=>bank.find(q=>q.id===id)).filter(Boolean);if(!currentSet.length){alert(mode==='wrong'?'아직 틀린 문제가 없어요!':'애매한 문제로 표시한 문제가 없어요!');return}currentIndex=0;document.getElementById('home').classList.add('hidden');document.getElementById('review').classList.add('hidden');document.getElementById('play').classList.remove('hidden');renderQuestion()}
function goHome(){document.getElementById('play').classList.add('hidden');document.getElementById('review').classList.add('hidden');document.getElementById('home').classList.remove('hidden');buildLevels();updateCounts()}
function showStats(){let el=document.getElementById('stats');el.classList.toggle('hidden');let total=Object.values(state.answered).filter(Boolean).length;let attempts=Object.values(state.scores).reduce((a,x)=>a+x.attempts,0);el.innerHTML=`<h2>🏆 주아의 기록</h2><p>지금까지 정답 처리된 문제: <strong>${total}</strong>개</p><p>레벨 도전 횟수: <strong>${attempts}</strong>회</p><p>완료한 레벨(15개 이상 정답): <strong>${Object.values(state.scores).filter(x=>x.best>=15).length}</strong> / 50</p>`}
function resetProgress(){if(confirm('정말 모든 기록을 초기화할까요?')){state={wrong:[],flagged:[],answered:{},scores:{}};save();buildLevels();document.getElementById('stats').classList.add('hidden')}}
buildLevels();updateCounts();
</script>
</body></html>
