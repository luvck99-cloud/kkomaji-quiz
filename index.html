<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<title>사랑하는 주아와 퀴즈놀이</title>
<style>
:root{--purple:#6c63ff;--pink:#ff7eb6;--ink:#24243a;--muted:#707087;--bg:#f7f6ff;--card:#fff;--good:#18865a;--bad:#d9415d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f2f0ff,#fff8fb 45%,#f7fbff);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{padding:24px 16px 18px;text-align:center;background:linear-gradient(120deg,#756bff,#ff87bd);color:#fff;border-radius:0 0 28px 28px}
h1{font-size:clamp(23px,5vw,34px);margin:0 0 7px}header p{margin:0;font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 22px #39306a12;border:1px solid #eeebff}
h2{font-size:21px;margin:0 0 12px}.muted{color:var(--muted);font-size:14px}
button{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:750;cursor:pointer;transition:transform .08s}
button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #ffbd4a;outline-offset:2px}
.primary{background:var(--purple);color:white}.secondary{background:#eeecff;color:#5149d7}.pink{background:#ffe6f1;color:#a62b68}.plain{background:#f1f2f8;color:#45455b}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.level-btn{background:#f1efff;color:#5149b8;padding:13px 4px}.level-btn.done{background:#dff8ed;color:#14754d}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f5ff;border-radius:15px;text-align:center;padding:12px}.stat strong{display:block;font-size:23px;color:#5b52dc}
.hidden{display:none!important}.progress{height:9px;background:#eeecf7;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#6c63ff,#ff7eb6);width:0%}
.badge{display:inline-block;border-radius:999px;padding:5px 10px;background:#f0edff;color:#5b52dc;font-size:12px;font-weight:800;margin:0 5px 8px 0}
.question{font-size:clamp(20px,4.5vw,27px);font-weight:800;line-height:1.5;margin:12px 0 20px;white-space:pre-wrap}
.choices{display:grid;gap:10px}.choice{background:#f6f5fc;border:2px solid transparent;text-align:left;padding:15px;font-size:17px;min-height:54px}.choice:hover{border-color:#c8c3ff}.choice.selected{border-color:var(--purple);background:#eeecff}.choice.correct{border-color:#7bd8b0;background:#e3fff1}.choice.wrong{border-color:#ff9cac;background:#fff0f2}
.feedback{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700}.feedback.good{background:#e3fff1;color:#126b46}.feedback.bad{background:#fff0f2;color:#a72c43}
.small-btn{font-size:13px;padding:9px 11px}.question-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.list-item{padding:13px 0;border-bottom:1px solid #eeeaf8}.list-item:last-child{border-bottom:0}.list-item p{margin:5px 0}.empty{text-align:center;color:var(--muted);padding:25px 8px}
footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
@media(max-width:430px){main{padding:10px}.card{padding:15px}.levels{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.level-btn{font-size:13px;padding:12px 1px}.stats strong{font-size:19px}}
</style>
</head>
<body>
<header><h1>💖 사랑하는 주아와 퀴즈놀이</h1><p>주아야, 오늘도 신나게 생각하고 함께 배워 보자!</p></header>
<main>
<section id="home">
  <div class="card">
    <h2>🌈 주아의 퀴즈 놀이터</h2>
    <p class="muted">레벨은 모두 열려 있어요. 원하는 단계를 골라 풀어 보세요. 시간제한은 없어요!</p>
    <div class="stats"><div class="stat"><strong id="doneCount">0</strong><span class="muted">완료한 레벨</span></div><div class="stat"><strong id="scoreCount">0</strong><span class="muted">정답 수</span></div><div class="stat"><strong id="unsureCount">0</strong><span class="muted">애매한 문제</span></div></div>
  </div>
  <div class="card"><h2>🧭 레벨 선택 (1~50)</h2><div class="levels" id="levels"></div></div>
  <div class="card"><h2>📚 다시 풀어보기</h2><div class="actions"><button class="pink" onclick="openCollection('unsure')">🤔 애매한 문제 <span id="unsureBtnCount">0</span></button><button class="secondary" onclick="openCollection('wrong')">🔁 틀린 문제 <span id="wrongBtnCount">0</span></button></div><p class="muted">문제를 푸는 중 ‘애매해요’를 누르면 따로 모아 둘 수 있어요.</p></div>
</section>
<section id="quiz" class="hidden">
  <div class="card">
    <div class="question-head"><div><span class="badge" id="levelBadge"></span><span class="badge" id="categoryBadge"></span></div><span class="muted" id="counter"></span></div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="question" id="questionText"></div>
    <div class="choices" id="choices"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="actions" style="margin-top:14px"><button class="pink" id="unsureAction" onclick="toggleUnsureCurrent()">🤔 애매해요</button><button class="plain" onclick="goHome()">🏠 레벨로</button><button class="primary" id="nextBtn" onclick="nextQuestion()" disabled>다음 문제 ➜</button></div>
  </div>
</section>
<section id="collection" class="hidden">
  <div class="card"><div class="question-head"><h2 id="collectionTitle">문제 모음</h2><button class="plain small-btn" onclick="goHome()">🏠 돌아가기</button></div><p class="muted" id="collectionHint"></p><div id="collectionList"></div></div>
</section>
<section id="result" class="hidden">
  <div class="card" style="text-align:center"><div style="font-size:48px">🎉</div><h2 id="resultTitle">레벨 완료!</h2><p id="resultText"></p><div class="actions"><button class="primary" onclick="goHome()">레벨 선택으로</button><button class="secondary" onclick="retryCurrentLevel()">이 레벨 다시 풀기</button></div></div>
</section>
</main>
<footer>주아를 위한 작은 배움의 모험 💗 · 진행 기록은 이 기기의 브라우저에 저장돼요.</footer>

const mathWords = [
["사과가 3개 있고 2개를 더 받았어요. 모두 몇 개일까요?",3,2,"+"],

function makeMath(level, n){
 const max=Math.min(12+level*3,99), a=2+((level*7+n*11)%Math.max(3,max-1)), b=1+((level*5+n*7)%Math.max(2,Math.min(a,12)));
 let op=['+','-','×'][(level+n)%3], x=a, y=b;
 if(op==='+'){x=1+((level*13+n*17)%Math.max(5,max-2));y=1+((level*3+n*19)%Math.max(4,Math.min(max,25))); }
 if(op==='-'){x=Math.max(a,b)+((level+n)%8);y=Math.min(x,1+((level*2+n*3)%Math.max(2,x))); }
 if(op==='×'){x=2+((level+n*2)%Math.min(12,2+Math.floor(level/3)));y=2+((level*3+n)%Math.min(12,2+Math.floor(level/3))); }
 const ans=op==='+'?x+y:op==='-'?x-y:x*y;
 const prompt=`계산해 보세요: ${x} ${op} ${y} = ?`;
 return {id:`M-${level}-${n}`,level,category:'수학',q:prompt,a:String(ans),choices:makeChoices(String(ans),[String(ans+1),String(Math.max(0,ans-1)),String(ans+2),String(Math.max(0,ans-2)),String(ans+3)]),explain:'천천히 계산해 보세요.'};
}
function makeChoices(correct, distractors){
 let arr=[String(correct),...distractors.map(String)].filter((v,i,a)=>a.indexOf(v)===i && v!==undefined);
 let k=1; while(arr.length<4){let v=String(`보기 ${k++}`);if(!arr.includes(v))arr.push(v)}
 // keep answer plus three distinct wrong choices
 arr=arr.slice(0,4); if(!arr.includes(String(correct)))arr[0]=String(correct);
 for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
 return arr;
}
function staticQ(item, category, id, level){
 const [q,a,...wrong]=item;return {id,level,category,q,a,choices:makeChoices(a,wrong)};
}
function buildBank(){
 let bank=[];
 for(let level=1;level<=50;level++){
   let local=[];
   for(let j=0;j<20;j++){
     let type=(j+level)%5, n=level*20+j, item, cat;
     if(type===0){let w=words[(level*7+j*3)%words.length];let reverse=(level+j)%2===0;item=reverse?[`What does “${w[0].trim()}” mean?`,w[1],...words.filter(x=>x[1]!==w[1]).slice((n%70), (n%70)+3).map(x=>x[1])]:[`“${w[1]}”의 영어 단어를 고르세요.`,w[0].trim(),...words.filter(x=>x[0].trim()!==w[0].trim()).slice((n%70),(n%70)+3).map(x=>x[0].trim())];cat='영어';local.push(staticQ(item,cat,`E-${n}`,level));}
     else if(type===1 || type===2){local.push(makeMath(level,j));}
     else if(type===3){item=scienceFacts[(level*3+j*2)%scienceFacts.length];local.push(staticQ(item,'과학',`S-${n}`,level));}
     else {let pool=(level%2===0)?generalFacts:spacingFacts;item=pool[(level*5+j*3)%pool.length];local.push(staticQ(item,(level%2===0)?'상식':'띄어쓰기',`K-${n}`,level));}
   }
   // Ensure each question in each level is distinct, including fixed fact rotations:
   local.forEach((q,idx)=>{q.q=`${q.q}`;});
   bank.push(...local);
 }
 // Questions are generated from unique level/slot combinations. A duplicate prompt is disambiguated with a short context tag,
 // preserving the question itself and guaranteeing that each displayed prompt is unique across the 1,000-question bank.
 const seen=new Set();
 bank.forEach(q=>{if(seen.has(q.q)){q.q += ` (도전 ${q.level}단계 ${Number(q.id.split('-').pop())%20+1}번)`;}seen.add(q.q);});
 return bank;
}

function chooseAnswer(choice,button){
 if(answers[currentQ.id])return;

 else{button.classList.add('wrong');fb.className='feedback bad';fb.textContent='괜찮아요! 다음에는 맞힐 수 있어요. 정답은 '+currentQ.a+'예요.';if(!data.wrong.includes(currentQ.id))data.wrong.push(currentQ.id)}
 fb.classList.remove('hidden');document.getElementById('nextBtn').disabled=false;save();
}
function toggleUnsureCurrent(){

function openCollection(type){

}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
