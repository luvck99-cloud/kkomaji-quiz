<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호리병 물 채우기 퍼즐 (Water Sort)</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 { margin: 5px; font-size: 1.8rem; }
        #info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        #game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 600px;
            min-height: 350px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        /* 호리병 스타일 */
        .bottle {
            width: 50px;
            height: 160px;
            border: 3px solid #fff;
            border-top: 5px solid #fff;
            border-radius: 15px 15px 25px 25px;
            position: relative;
            display: flex;
            flex-direction: column-reverse;
            overflow: hidden;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, border-color 0.2s;
        }
        .bottle.selected {
            transform: translateY(-10px);
            border-color: #ffd700;
            box-shadow: 0 0 15px #ffd700;
        }
        .bottle.long-bottle {
            height: 220px; /* 5스테이지 보너스 판용 긴 물통 */
        }
        /* 목 부분 디자인 */
        .bottle::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 15px;
            width: 14px;
            height: 10px;
            border: 3px solid #fff;
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            background: rgba(255, 255, 255, 0.1);
        }
        .water-layer {
            width: 100%;
            transition: height 0.3s ease;
        }
        #controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ff7675;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #d63031; }
        button:disabled { background: #b2bec3; cursor: not-allowed; }
        #joker-btn { background: #fdcb6e; color: #2d3436; }
        #joker-btn:hover { background: #e1b12c; }
    </style>
</head>
<body>

    <h1>🏺 호리병 물 퍼즐</h1>
    <div id="info-bar">
        <span id="level-text">레벨: 1</span>
        <span id="mode-text">일반 모드</span>
    </div>

    <div id="game-container"></div>

    <div id="controls">
        <button id="joker-btn" onclick="useJoker()">조커 찬스 (남은 횟수: 1)</button>
        <button onclick="resetLevel()">다시 하기</button>
        <button onclick="nextLevel()">다음 레벨 (테스트용)</button>
    </div>

    <script>
        const COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#00d2d3', '#ff6b81', '#57606f'];
        let currentLevel = 1;
        let bottles = [];
        let selectedBottleIndex = null;
        let jokerAvailable = true;
        let isBonusStage = false;
        const capacity = 4;

        // Web Audio API를 이용한 물 따르는 효과음 생성
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playPourSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function initLevel() {
            selectedBottleIndex = null;
            jokerAvailable = true;
            document.getElementById('joker-btn').disabled = false;
            document.getElementById('joker-btn').innerText = "조커 찬스 (남은 횟수: 1)";

            // 5단계마다 보너스 판 (규칙 7, 8, 9)
            isBonusStage = (currentLevel % 5 === 0);
            document.getElementById('level-text').innerText = `레벨: ${currentLevel}`;
            
            if (isBonusStage) {
                document.getElementById('mode-text').innerText = "✨ 보너스 판 (긴 물통 모으기)";
                setupBonusStage();
            } else {
                document.getElementById('mode-text').innerText = "일반 모드";
                setupNormalStage();
            }
            render();
        }

        // 일반 스테이지 설정 (난이도 곡선 적용: 1~2단계마다 색상/병 증가)
        function setupNormalStage() {
            let colorCount = Math.min(3 + Math.floor(currentLevel / 3), COLORS.length);
            let emptyCount = 2; 
            let totalBottles = colorCount + emptyCount;
            
            let allColors = [];
            for (let i = 0; i < colorCount; i++) {
                for (let j = 0; j < capacity; j++) allColors.push(i);
            }
            // 셔플
            allColors.sort(() => Math.random() - 0.5);

            bottles = [];
            for (let i = 0; i < colorCount; i++) {
                bottles.push(allColors.slice(i * capacity, (i + 1) * capacity));
            }
            for (let i = 0; i < emptyCount; i++) {
                bottles.push([]);
            }
        }

        // 보너스 스테이지 설정 (긴 물통에 한 색깔 모으기)
        function setupBonusStage() {
            let colorCount = Math.min(2 + Math.floor(currentLevel / 10), 4);
            let bonusCapacity = 6; // 긴 물통 용량
            bottles = [];

            let allColors = [];
            for (let i = 0; i < colorCount; i++) {
                for (let j = 0; j < bonusCapacity; j++) allColors.push(i);
            }
            allColors.sort(() => Math.random() - 0.5);

            for (let i = 0; i < colorCount; i++) {
                bottles.push(allColors.slice(i * bonusCapacity, (i + 1) * bonusCapacity));
            }
            bottles.push([]); // 빈 병 1개
        }

        function render() {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            bottles.forEach((bottle, index) => {
                const bDiv = document.createElement('div');
                bDiv.className = `bottle ${isBonusStage ? 'long-bottle' : ''} ${selectedBottleIndex === index ? 'selected' : ''}`;
                bDiv.onclick = () => handleBottleClick(index);

                bottle.forEach(colorIndex => {
                    const layer = document.createElement('div');
                    layer.className = 'water-layer';
                    layer.style.height = `${100 / (isBonusStage ? 6 : 4)}%`;
                    layer.style.backgroundColor = COLORS[colorIndex];
                    bDiv.appendChild(layer);
                });
                container.appendChild(bDiv);
            });
        }

        function handleBottleClick(index) {
            if (selectedBottleIndex === null) {
                if (bottles[index].length === 0) return; // 빈 병은 선택 불가
                selectedBottleIndex = index;
            } else {
                if (selectedBottleIndex === index) {
                    selectedBottleIndex = null; // 선택 해제
                } else {
                    moveWater(selectedBottleIndex, index, false);
                }
            }
            render();
        }

        // 물 이동 로직 (규칙 6: 연속된 같은 색상 한 번에 옮기기 지원)
        function moveWater(from, to, forceJoker) {
            let fromB = bottles[from];
            let toB = bottles[to];
            let maxCap = isBonusStage ? 6 : 4;

            if (toB.length >= maxCap && !forceJoker) {
                alert("병이 가득 찼습니다!");
                selectedBottleIndex = null;
                return;
            }

            if (fromB.length === 0) {
                selectedBottleIndex = null;
                return;
            }

            let targetColor = fromB[fromB.length - 1];

            // 조커 찬스가 아닐 때의 일반 규칙 검증
            if (!forceJoker) {
                if (toB.length > 0 && toB[toB.length - 1] !== targetColor) {
                    alert("같은 색상의 물 위에만 옮길 수 있습니다!");
                    selectedBottleIndex = null;
                    return;
                }
            }

            // 연속된 같은 색상 개수 파악
            let count = 0;
            for (let i = fromB.length - 1; i >= 0; i--) {
                if (fromB[i] === targetColor) count++;
                else break;
            }

            // 목적지에 들어갈 수 있는 공간 계산
            let spaceLeft = maxCap - toB.length;
            let moveCount = forceJoker ? Math.min(count, spaceLeft) : Math.min(count, spaceLeft);

            if (moveCount <= 0 && !forceJoker) {
                alert("더 이상 옮길 공간이 없습니다!");
                selectedBottleIndex = null;
                return;
            }

            // 실제 이동 수행
            playPourSound();
            for (let i = 0; i < moveCount; i++) {
                toB.push(fromB.pop());
            }

            selectedBottleIndex = null;
            checkWin();
        }

        // 조커 찬스 사용 (규칙 5)
        function useJoker() {
            if (!jokerAvailable) return;
            if (selectedBottleIndex === null) {
                alert("먼저 옮길 출발 병을 선택해주세요!");
                return;
            }
            let targetTo = prompt("아무 곳이나 옮길 목적지 병 번호 입력 (1부터 시작):");
            if (targetTo === null) return;
            let toIndex = parseInt(targetTo) - 1;

            if (toIndex >= 0 && toIndex < bottles.length && toIndex !== selectedBottleIndex) {
                moveWater(selectedBottleIndex, toIndex, true);
                jokerAvailable = false;
                document.getElementById('joker-btn').disabled = true;
                document.getElementById('joker-btn').innerText = "조커 사용 완료";
                render();
            } else {
                alert("올바르지 않은 병 번호입니다.");
            }
        }

        // 클리어 조건 검사
        function checkWin() {
            let isWon = bottles.every(b => {
                if (b.length === 0) return true;
                let maxCap = isBonusStage ? 6 : 4;
                if (b.length !== maxCap) return false;
                return b.every(c => c === b[0]);
            });

            if (isWon) {
                setTimeout(() => {
                    alert(`🎉 레벨 ${currentLevel} 클리어! 다음 단계로 이동합니다.`);
                    currentLevel++;
                    initLevel();
                }, 100);
            }
        }

        function resetLevel() {
            initLevel();
        }

        function nextLevel() {
            currentLevel++;
            initLevel();
        }

        // 게임 최초 시작
        initLevel();
    </script>
</body>
</html>
